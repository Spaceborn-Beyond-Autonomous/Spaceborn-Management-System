services:
  - type: web
    name: spaceborn-cms
    runtime: node
    plan: free
    region: oregon
    # Use lockfiles, skip backend devDependencies, and avoid CRA source maps
    # to lower peak build memory on small Render instances.
    buildCommand: npm ci --prefix backend --omit=dev && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: spaceborn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d

databases:
  - name: spaceborn-db
    databaseName: spaceborn
    user: spaceborn_user
    plan: free
    region: oregon
