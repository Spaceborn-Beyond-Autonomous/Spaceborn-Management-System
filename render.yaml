services:
  - type: web
    name: spaceborn-cms
    runtime: node
    plan: free
    region: oregon
    # The frontend is hosted on Vercel; this Render service only runs the API.
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spaceborn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d

databases:
  - name: spaceborn-db
    databaseName: spaceborn
    user: spaceborn_user
    plan: free
    region: oregon
